<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Sign Up/ In</title>
    <link href="style.css"  rel="stylesheet">
</head>
<body>
    <div class="body_container">
        <div class="pic">
           <div class="header">
                <div class="logo">
                    <img class="logo_icon" src="icons/logo.png">
                </div>
                <div class="header_name">
                    signup/signin
                </div>
            </div>
            <div class="motiv_quote">
                <p>Get Started</p>
                <p>with Us</p>
            </div> 
            <footer class="footer">
                <div class="copyright_text">© Nurullina Kamila, 2026 </div>
            </footer>
        </div>
        <div class="regist">
            <!-- Sign Up -->
            <div class="sign_up_page" id="signup">
                <div class="form_main_quote">Sign Up Account</div>
                <div class="sub-headline">Enter your personal data to create your account.</div>
                <div class="social-buttons">
                    <button class="social-btn"><span>-</span> Google</button>
                    <button class="social-btn"><span>-</span> Github</button>
                </div>
                <div class="divider">Or</div>
                <form class="form">
                    <div class="names-group">
                        <div class="form-group">
                            <label for="fname">First Name</label>
                            <input type="text" id="fname" name="fname" placeholder="Kamila">
                        </div>
                        <div class="form-group">
                            <label for="lname">Last Name</label>
                            <input type="text" id="lname" name="lname" placeholder="Nurullina">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="kamilanurullina@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="*********">
                        <div class="password-hint">Must be at least 8 characters.</div>
                    </div>
                    <input type="submit" value="Sign Up" class="submit_button">
                </form>
                <div class="additional-links">
                    <a class="already-account" href="#" onclick="showSignIn(); return false;">Already have an account? Log in</a>
                </div>
            </div>

            <!-- Sign In (теперь отдельно) -->
            <div class="sign_in_page hidden" id="signin">
                <div class="form_main_quote">Sign In Account</div>
                <div class="social-buttons">
                    <button class="social-btn"><span>-</span> Google</button>
                    <button class="social-btn"><span>-</span> Github</button>
                </div>
                <form class="form">
                    <div class="form-group">
                        <label for="signin-email">Email</label>
                        <input type="email" id="signin-email" name="email" placeholder="kamilanurullina@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="signin-password">Password</label>
                        <input type="password" id="signin-password" name="password" placeholder="*********">
                        <div class="password-hint">Must be at least 8 characters.</div>
                    </div>
                    <input type="submit" value="Sign In" class="submit_button">
                </form>
                <div class="additional-links">
                    <a class="not-account" href="#" onclick="showSignUp(); return false;">Don't have an account? Sign up</a>
                </div>
            </div>
        </div>

    </div>

    
    
</body>


<script>
    function showSignIn() {
        document.getElementById('signup').style.display = 'none';
        document.getElementById('signin').style.display = 'block';
    }
    function showSignUp() {
        document.getElementById('signin').style.display = 'none';
        document.getElementById('signup').style.display = 'block';
    }
</script>

</html>
